<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07301F">
<title>Madrasa Dar ul Ma'arij — Daily Reports</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
(function () {
  try {
    var t = localStorage.getItem('mdm_theme') || 'light';
    var l = localStorage.getItem('mdm_lang') || 'en';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status"></div>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
